<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Agora SIP video: match the SIP side's codecs</title>
<!-- Agora Web SDK 4.x. Pin the version you have tested. -->
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.24.9.js"></script>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; }
  label { margin-right: 12px; }
  input { width: 260px; }
  #videos { display: flex; gap: 8px; margin-top: 12px; }
  #videos > div { width: 320px; height: 240px; background: #222; }
  #log { margin-top: 12px; font: 12px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<h3>Join a channel, then let a SIP video client dial into it</h3>
<label>App ID <input id="appid"></label>
<label>Channel <input id="channel"></label><br>
<label>Token <input id="token" placeholder="RTC token from your token server (empty if none)"></label>
<label>UID <input id="uid" value="1001"></label><br>
<button id="join">Join</button> <button id="leave" disabled>Leave</button>
<div id="videos"><div id="local"></div><div id="remote"></div></div>
<div id="log"></div>

<script>
'use strict';
// SIP calls on the video entrypoints pass media through without transcoding, so the browser
// must publish the video and audio codecs the SIP client negotiated. The Web SDK fixes both
// codecs when the client is created, so a change of codec is: leave, create a client with the
// new codecs, join again with the same uid, publish the same tracks.
// To keep it to one re-join and one picture: learn BOTH codecs first, switch once, and render
// the remote video only when its codecs match ours.

const VIDEO = { H264: 'h264', VP8: 'vp8', AV1: 'av1', AV1X: 'av1' };   // SDK codecType -> createClient codec
const AUDIO = ['opus', 'pcmu', 'pcma', 'g722'];                         // createClient audioCodec values
const MAX_SWITCHES = 4;      // two remotes with different codecs must not make the page flap

const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent += new Date().toISOString().slice(11, 19) + ' ' + m + '\n'; };
const st = { client: null, codec: 'h264', acodec: 'opus', mic: null, cam: null, switches: 0, remotes: new Map(), session: 0 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Your own server issues tokens; never put the App Certificate in a web page.
async function getToken() { return $('token').value.trim() || null; }

async function connect(codec, acodec) {
  const client = AgoraRTC.createClient({ mode: 'rtc', codec, audioCodec: acodec });
  st.client = client; st.codec = codec; st.acodec = acodec;
  // A client replaced by a switch still fires events: ignore them.
  client.on('user-published', (user, kind) => { if (st.client === client) onPublished(client, user, kind); });
  client.on('user-unpublished', (user, kind) => { if (st.client === client) log(`remote ${user.uid} unpublished ${kind}`); });
  await client.join($('appid').value.trim(), $('channel').value.trim(), await getToken(), Number($('uid').value));
  await client.publish([st.mic, st.cam]);
  log(`joined, publishing ${codec.toUpperCase()} video and ${acodec.toUpperCase()} audio`);
}

async function onPublished(client, user, kind) {
  await client.subscribe(user, kind);
  if (st.client !== client) return;                // replaced while subscribing
  const r = st.remotes.get(user.uid) || { video: null, audio: null };
  st.remotes.set(user.uid, r);
  if (kind === 'audio') user.audioTrack.play();     // audio plays at once; video waits for the codecs
  // The codec shows up in the stats within about a second of the first packets.
  for (let i = 0; i < 40 && st.client === client; i++) {
    const s = kind === 'video' ? client.getRemoteVideoStats()[user.uid] : client.getRemoteAudioStats()[user.uid];
    const type = s && s.codecType && String(s.codecType);
    if (type) {
      r[kind] = kind === 'video' ? VIDEO[type.toUpperCase()] : (AUDIO.includes(type.toLowerCase()) ? type.toLowerCase() : null);
      log(`remote ${user.uid} sends ${type.toUpperCase()} ${kind}`);
      return decide(client, user, r);
    }
    await sleep(250);
  }
  if (kind === 'video') user.videoTrack.play('remote');   // codec never known: show it anyway
}

// One switch for both codecs. A SIP caller's audio arrives about a second before its video:
// after the audio codec, wait up to 3 s for a video (voice-only callers just switch later).
// Each watcher calls this when it learns its codec; one decides at a time, and a video that
// arrives after a decision is decided again. A replaced client's decision just stops.
async function decide(client, user, r) {
  if (r.deciding) return;              // the other kind's watcher is deciding and will see this codec
  r.deciding = true;
  try {
    for (let t = 0; t < 3000 && st.client === client; t += 250) {
      const videoPending = user.hasVideo ? !r.video : true;
      const audioPending = user.hasAudio && !r.audio;
      if (!videoPending && !audioPending) break;
      await sleep(250);
    }
    if (st.client !== client) return;
    const codec = r.video || st.codec, acodec = r.audio || st.acodec;
    if ((codec !== st.codec || acodec !== st.acodec) && st.switches < MAX_SWITCHES) return await rejoin(codec, acodec);
    if (user.hasVideo && user.videoTrack) user.videoTrack.play('remote');   // match, or no more switches: render once
  } finally { r.deciding = false; }
}

async function rejoin(codec, acodec) {
  const session = st.session;
  st.switches++;
  log(`switching to ${codec.toUpperCase()} / ${acodec.toUpperCase()} to match the SIP side (one re-join)`);
  const old = st.client; st.client = null; st.remotes.clear();
  await old.leave();                   // the tracks stay open and are published again
  if (st.session !== session) return;  // Leave pressed meanwhile
  await connect(codec, acodec);        // fetches a fresh token: the old one may have expired
  if (st.session !== session && st.client) { const c = st.client; st.client = null; await c.leave(); }
}

$('join').onclick = async () => {
  $('join').disabled = true;
  try {
    st.mic = await AgoraRTC.createMicrophoneAudioTrack();
    st.cam = await AgoraRTC.createCameraVideoTrack({ encoderConfig: '480p_1' });
    st.cam.play('local');
    st.switches = 0; st.remotes.clear();
    await connect('h264', 'opus');
    $('leave').disabled = false;
  } catch (e) { log('join failed: ' + e.message); $('join').disabled = false; }
};

$('leave').onclick = async () => {
  st.session++;                        // cancels a switch in flight
  const c = st.client; st.client = null;
  if (c) await c.leave();
  for (const t of [st.mic, st.cam]) if (t) { t.stop(); t.close(); }
  $('leave').disabled = true; $('join').disabled = false;
  log('left');
};
</script>
</body>
</html>
